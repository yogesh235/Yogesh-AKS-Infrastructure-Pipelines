# This is a basic workflow to help you get started with Actions

name: TerraformInfra

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Terraform-build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: Azure/login@v3
        with:
        # Paste output of `az ad sp create-for-rbac` as value of secret variable: AZURE_CREDENTIALS
         creds: ${{secrets.CREDENTIAL}}
         client-id: a1a4f875-e7dc-43dc-b1a9-9e7d32426ae6
         # TenantId of the Azure Service principal created.
         tenant-id: da01548b-20fc-4057-8cda-5c68e4fcdd3e
         # Azure subscriptionId
         subscription-id: 36e459d6-916d-4929-bb97-1894ec00e647
      # Sets up Terraform CLI in your GitHub Actions workflow
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3

      # Runs a set of commands using the runners shell
      - name: Terraform Init
        working-directory: ResourceGroup_Infra/Root
        run: terraform init

      - name: Terrafrom Plan
        working-directory: ResourceGroup_Infra/Root
        run: terraform plan --var-file="Prod.tfvars"
