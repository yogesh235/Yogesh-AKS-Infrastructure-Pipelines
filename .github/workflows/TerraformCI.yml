# This is a basic workflow to help you get started with Actions

name: TerraformInfra

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Terraform-build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Install azure-cli
        # You may pin to the exact commit or the version.
        # uses: pietrobolcato/install-azure-cli-action@9a10af1be5e3eb7931f48c0290364a131e7ecd70
        uses: pietrobolcato/install-azure-cli-action@v1.0.1
      - name: Azure CLI Login
        uses: azure/cli@v3
        with:
         inlineScript: |
           az login --subscription 36e459d6-916d-4929-bb97-1894ec00e647
           az account show
      # Sets up Terraform CLI in your GitHub Actions workflow
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3

      # Runs a set of commands using the runners shell
      - name: Terraform Init
        working-directory: ResourceGroup_Infra/Root
        run: terraform init

      - name: Terrafrom Plan
        working-directory: ResourceGroup_Infra/Root
        run: terraform plan --var-file="Prod.tfvars"
